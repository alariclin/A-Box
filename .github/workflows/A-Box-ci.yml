name: A-Box CI

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  shell-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, pinned Node 24 runtime
        with:
          fetch-depth: 0
          persist-credentials: false
          # U60: PR events check out the temporary merge commit by default;
          # the README SHA gate below must see the real head commit, so pin
          # the checkout to the PR head SHA (push events fall back to github.sha).
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Bash syntax
        run: |
          bash -n install.sh
          bash -n scripts/update-core-mirror.sh
          bash -n scripts/prune-core-mirror.sh
      - name: ShellCheck installation critical errors
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=error install.sh scripts/update-core-mirror.sh scripts/prune-core-mirror.sh
      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12, pinned to commit SHA
      - name: Built-in self-test (root-only fixtures enabled)
        run: sudo bash install.sh --self-test
      - name: Release metadata regression
        run: |
          grep -Eq "^ABOX_BUILD='[^']+'$" install.sh
          grep -Eq '^ABOX_BUILD_EPOCH=[0-9]+$' install.sh
          grep -Fq "ABOX_XRAY_UPDATE_POLICY=\"\${ABOX_XRAY_UPDATE_POLICY:-auto-stable}\"" install.sh
          grep -Fq "ABOX_XRAY_REALITY_MLKEM_MIN_VERSION='v26.9.8'" install.sh
          grep -Fq "ABOX_HYSTERIA_DEFAULT_VERSION='app/v2.13.0'" install.sh
          grep -Fq "ABOX_SINGBOX_DEFAULT_VERSION='v1.14.3'" install.sh
          if grep -Fq 'EOF_SNI_CANDIDATES' install.sh; then echo 'legacy embedded SNI candidate block found' >&2; exit 1; fi
          grep -Fq 'ABOX_SNI_CANDIDATE_URL_DEFAULT=' install.sh
          test -s data/sni-candidates.txt
          python3 -c "
          import re, sys
          pat = re.compile(r'^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$')
          n = 0
          seen = set()
          for line in open('data/sni-candidates.txt'):
              s = line.strip()
              if not s or s.startswith('#'):
                  continue
              if not pat.match(s):
                  sys.exit(1)
              if s.lower() in seen:
                  sys.exit(1)
              seen.add(s.lower())
              n += 1
          if not (100 <= n <= 12000):
              sys.exit(1)
          "
          duplicates=$(awk 'NF && $0 !~ /^[[:space:]]*#/ {print tolower($0)}' data/sni-candidates.txt | sort | uniq -d | wc -l)
          test "$duplicates" -eq 0

      - name: Verify README pinned SHA matches latest install.sh commit
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, sys
          expected_sha = subprocess.check_output(
              ["git", "log", "-n", "1", "--format=%H", "--", "install.sh"],
              text=True
          ).strip()
          pattern = re.compile(r"raw\.githubusercontent\.com/alariclin/A-Box/([0-9a-f]{40})/install\.sh")
          readme_files = sorted(pathlib.Path(".").glob("README*.md"))
          if not readme_files:
              print("ERROR: No README*.md files found", file=sys.stderr)
              sys.exit(1)
          for path in readme_files:
              content = path.read_text(encoding="utf-8")
              matches = pattern.findall(content)
              if not matches:
                  print(f"ERROR: No pinned install.sh URL found in {path}", file=sys.stderr)
                  sys.exit(1)
              for sha in matches:
                  if sha != expected_sha:
                      print(f"ERROR: {path} pins {sha}, expected {expected_sha} (last install.sh commit)", file=sys.stderr)
                      sys.exit(1)
          print(f"OK: All {len(readme_files)} README files correctly pin install.sh commit {expected_sha}")
          PY
      - name: Verify normalize_managed_rule_line definitions (BUG-28 + B-02)
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path("install.sh").read_text(encoding="utf-8")
          # Split out the firewall_restore.sh heredoc (standalone script needs its own closure).
          h_start = text.index("<<'EOF_ABOX_FW_RESTORE'")
          h_end = text.index("\nEOF_ABOX_FW_RESTORE", h_start)
          heredoc, main = text[h_start:h_end], text[:h_start] + text[h_end:]
          pattern = re.compile(r"(?:__abox_)?normalize_managed_rule_line\s*\(\)\s*\{")
          m_main, m_hero = pattern.findall(main), pattern.findall(heredoc)
          if len(m_main) != 1 or len(m_hero) != 1:
              sys.exit(f"ERROR: Expected 1 in main + 1 in heredoc, found {len(m_main)}+{len(m_hero)}")
          print("OK: normalize_managed_rule_line defined once in main and once in heredoc closure")
          PY
      - name: Six-language i18n gate
        run: |
          python3 - <<'PY'
          import re, sys
          text = open("install.sh", encoding="utf-8").read()
          errors = []

          # 1. 禁止二分支 if ABOX_LANG == en（必须用六语言 case）
          for i, line in enumerate(text.splitlines(), 1):
              if re.search(r'if\s+\[\[.*ABOX_LANG.*==.*[\'"]en[\'"]', line):
                  errors.append(f"Line {i}: bare 'if ABOX_LANG == en' found, use 6-language case instead")

          # 2. 检查 [Y/N] / [y/n] 未被翻译（不应出现 [はい / [いいえ）
          if "[はい" in text or "[いいえ" in text:
              errors.append("Found translated [Y/N] markers ([はい / [いいえ), must keep [Y/N] as-is")

          # 3. 检查变量名未被翻译（${...} 的参数名部分必须是纯 ASCII；
          #    捕获组本身不能限定 ASCII，否则被翻译的变量名根本匹配不到、
          #    检查恒空转。默认值里的 CJK 字面量不在参数名部分，不误报）
          CJK = re.compile(r'[\u4e00-\u9fff\u3040-\u309f\u30a0-\u30ff\uac00-\ud7af]')
          for m in re.finditer(r'\$\{([^}]*)\}', text):
              inner = m.group(1)
              varname = re.split(r'[:#%/@,+\-=?^]', inner, 1)[0]
              if CJK.search(varname):
                  errors.append("Translated variable name: ${" + inner[:40] + "}")

          # 4. 检查 ja) 分支的 %s/%d 数量与 en) 一致（单行 tr_msg 条目；
          #    跨行条目与完整变量集合对齐检查在 --self-test 中覆盖）
          entry = re.compile(r"^\s*(en|ja):([A-Za-z0-9_]+)\)\s+echo\s+'(.*?)'\s*;;?\s*$", re.M)
          fmts = {}
          for lang, key, body in entry.findall(text):
              fmts.setdefault(key, {})[lang] = body
          def ph(b):
              return len(re.findall(r'%[sd]', b.replace('%%', '')))
          for key, d in fmts.items():
              if 'en' in d and 'ja' in d and ph(d['en']) != ph(d['ja']):
                  errors.append(f"Placeholder mismatch en/ja for key {key}: en={ph(d['en'])} ja={ph(d['ja'])}")

          if errors:
              print("I18N GATE FAILURES:")
              for e in errors[:20]:
                  print(f"  - {e}")
              sys.exit(1)
          print("OK: six-language i18n gate passed")
          PY
  fixture-compat-matrix:
    # P1-06 (GPT A'): minimal cross-distro fixture-compatibility matrix.
    # NOT a real runtime matrix: --self-test is fixture/static assertions,
    # it never installs real cores or touches the network. Debian slim gives
    # a clean GNU/glibc userland, Alpine a musl one; the old standalone
    # Alpine syntax step is folded in here (it now runs the full self-test).
    # Job id is fixture-compat-matrix (not fixture-compat): a matrix job
    # reports checks as "<id> (matrix values)", which never exactly matches
    # the ruleset's required check "fixture-compat". The bare name belongs
    # to the fixture-compat summary gate below (needs + if: always()).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - image: debian:bookworm-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc
            pkgmgr: apt
            selftest_timeout: 90
          - image: alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
            pkgmgr: apk
            selftest_timeout: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, pinned Node 24 runtime
        with:
          persist-credentials: false
      - name: Fixture compatibility (${{ matrix.image }})
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /tmp --user 0:0 "${{ matrix.image }}" sh -ec '
            set -eu
            if [ "${{ matrix.pkgmgr }}" = "apt" ]; then
              export DEBIAN_FRONTEND=noninteractive TZ=Etc/UTC
              apt-get update
              apt-get install -y --no-install-recommends bash tzdata iptables openssl python3 jq curl wget tar unzip zip
            else
              apk add --no-cache bash tzdata iptables openssl python3 jq curl wget tar unzip zip
            fi
            command -v timeout
            bash -n /src/install.sh
            log=$(mktemp)
            trap "rm -f $log" EXIT
            rc=0
            timeout -k 5 ${{ matrix.selftest_timeout }} bash /src/install.sh --self-test >"$log" 2>&1 || rc=$?
            cat "$log"
            test "$rc" -eq 0
            grep -Fxq "SELF_TEST_OK" "$log"
            if grep -Fq "SELF_TEST_FAILED" "$log"; then exit 1; fi
          '


  fixture-compat:
    # Fixed-name summary gate for fixture-compat-matrix above.
    # Required by the "Protect main" ruleset (exact-name match); reports
    # success only when the whole matrix succeeded. if: always() + an
    # explicit result check: a skipped gate must never read as a pass.
    name: fixture-compat
    needs: fixture-compat-matrix
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the complete matrix to pass
        env:
          MATRIX_RESULT: ${{ needs.fixture-compat-matrix.result }}
        run: test "$MATRIX_RESULT" = success
