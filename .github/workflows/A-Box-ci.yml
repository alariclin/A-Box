name: A-Box CI

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  shell-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, pinned Node 24 runtime
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bash syntax
        run: |
          bash -n install.sh
          bash -n scripts/update-core-mirror.sh
          bash -n scripts/upload-rollback-binaries.sh
      - name: ShellCheck installation critical errors
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=error install.sh scripts/update-core-mirror.sh scripts/upload-rollback-binaries.sh
      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12, pinned to commit SHA
      - name: Built-in self-test (root-only fixtures enabled)
        run: sudo bash install.sh --self-test
      - name: Release metadata regression
        run: |
          grep -Eq "^ABOX_BUILD='[^']+'$" install.sh
          grep -Eq '^ABOX_BUILD_EPOCH=[0-9]+$' install.sh
          grep -Fq "ABOX_XRAY_DEFAULT_VERSION='v26.7.28'" install.sh
          grep -Fq "ABOX_XRAY_REALITY_MLKEM_MIN_VERSION='v26.9.8'" install.sh
          grep -Fq "ABOX_HYSTERIA_DEFAULT_VERSION='app/v2.13.0'" install.sh
          grep -Fq "ABOX_SINGBOX_DEFAULT_VERSION='v1.14.3'" install.sh
          if grep -Fq 'EOF_SNI_CANDIDATES' install.sh; then echo 'legacy embedded SNI candidate block found' >&2; exit 1; fi
          grep -Fq 'ABOX_SNI_CANDIDATE_URL_DEFAULT=' install.sh
          test -s data/sni-candidates.txt
          python3 -c "
          import re, sys
          pat = re.compile(r'^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$')
          n = 0
          seen = set()
          for line in open('data/sni-candidates.txt'):
              s = line.strip()
              if not s or s.startswith('#'):
                  continue
              if not pat.match(s):
                  sys.exit(1)
              if s.lower() in seen:
                  sys.exit(1)
              seen.add(s.lower())
              n += 1
          if not (100 <= n <= 12000):
              sys.exit(1)
          "
          duplicates=$(awk 'NF && $0 !~ /^[[:space:]]*#/ {print tolower($0)}' data/sni-candidates.txt | sort | uniq -d | wc -l)
          test "$duplicates" -eq 0

      - name: Verify README pinned SHA matches latest install.sh commit
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, sys
          expected_sha = subprocess.check_output(
              ["git", "log", "-n", "1", "--format=%H", "--", "install.sh"],
              text=True
          ).strip()
          pattern = re.compile(r"raw\.githubusercontent\.com/alariclin/A-Box/([0-9a-f]{40})/install\.sh")
          readme_files = sorted(pathlib.Path(".").glob("README*.md"))
          if not readme_files:
              print("ERROR: No README*.md files found", file=sys.stderr)
              sys.exit(1)
          for path in readme_files:
              content = path.read_text(encoding="utf-8")
              matches = pattern.findall(content)
              if not matches:
                  print(f"ERROR: No pinned install.sh URL found in {path}", file=sys.stderr)
                  sys.exit(1)
              for sha in matches:
                  if sha != expected_sha:
                      print(f"ERROR: {path} pins {sha}, expected {expected_sha} (last install.sh commit)", file=sys.stderr)
                      sys.exit(1)
          print(f"OK: All {len(readme_files)} README files correctly pin install.sh commit {expected_sha}")
          PY
      - name: Verify i18n case blocks have en) branch
        run: |
          python3 - <<'PY'
          import re, sys
          with open('install.sh', encoding='utf-8') as f:
              content = f.read()
          # Find all case "${ABOX_LANG...}" blocks and check for en) branch
          # This is a simple heuristic: find 'case "${ABOX_LANG' then check
          # if 'en)' appears before the matching 'esac'
          pattern = re.compile(r'case "\$\{ABOX_LANG[^}]*\}" in(.*?)(?=\nesac)', re.DOTALL)
          missing = []
          for i, m in enumerate(pattern.finditer(content)):
              block = m.group(1)
              if 'en)' not in block:
                  # Get line number
                  lineno = content[:m.start()].count('\n') + 1
                  missing.append(lineno)
          if missing:
              print(f"ERROR: {len(missing)} case ABOX_LANG blocks missing en) branch at lines: {missing[:10]}", file=sys.stderr)
              sys.exit(1)
          print(f"OK: All case ABOX_LANG blocks have en) branch")
          PY
      - name: Verify normalize_managed_rule_line definitions (BUG-28 + B-02)
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path("install.sh").read_text(encoding="utf-8")
          # Split out the firewall_restore.sh heredoc (standalone script needs its own closure).
          h_start = text.index("<<'EOF_ABOX_FW_RESTORE'")
          h_end = text.index("\nEOF_ABOX_FW_RESTORE", h_start)
          heredoc, main = text[h_start:h_end], text[:h_start] + text[h_end:]
          pattern = re.compile(r"(?:__abox_)?normalize_managed_rule_line\s*\(\)\s*\{")
          m_main, m_hero = pattern.findall(main), pattern.findall(heredoc)
          if len(m_main) != 1 or len(m_hero) != 1:
              sys.exit(f"ERROR: Expected 1 in main + 1 in heredoc, found {len(m_main)}+{len(m_hero)}")
          print("OK: normalize_managed_rule_line defined once in main and once in heredoc closure")
          PY
      # P3-13 fix: renamed from "Alpine clean-shell bootstrap syntax".
      # NOTE: This only checks syntax. Alpine runtime (BusyBox/musl/apk)
      # is NOT tested here.
      - name: Alpine syntax only
        run: |
          docker run --rm -v "$PWD:/src:ro" alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8 sh -ec '
            apk add --no-cache bash
            bash -n /src/install.sh
          '
