name: A-Box CI

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  shell-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned to a resolved commit (Node 24)
      - name: Install static-analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Bash and workflow static analysis
        run: |
          bash -n install.sh
          shellcheck --severity=error --shell=bash install.sh
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
      - name: Built-in self-test (including root-only fixtures)
        run: sudo bash install.sh --self-test
      - name: Release metadata regression
        run: |
          grep -Eq "^ABOX_BUILD='[^']+'$" install.sh
          grep -Eq '^ABOX_BUILD_EPOCH=[0-9]+$' install.sh
          grep -Fq "ABOX_XRAY_DEFAULT_VERSION='v26.7.28'" install.sh
          grep -Fq "ABOX_XRAY_REALITY_MLKEM_MIN_VERSION='v26.9.8'" install.sh
          grep -Fq 'v2.13.0' install.sh
          ! grep -Fq 'EOF_SNI_CANDIDATES' install.sh
          grep -Fq 'ABOX_SNI_CANDIDATE_URL_DEFAULT=' install.sh
          grep -Fq 'x-ratelimit-reset' install.sh
          grep -Fq '此路径信任 A-Box Release 发布者' install.sh
          grep -Fq 'Lines:.*[1-9][0-9]* matched' install.sh
          grep -Fq '/var/lib/A-Box/geo-transaction' install.sh
          grep -Fq '127.0.0.1:$port:80/tcp' install.sh
          grep -Fq 'wallos_restore_backup_atomically' install.sh
          test -s data/sni-candidates.txt
          awk '
            NF && $0 !~ /^[[:space:]]*#/ {
              if ($0 !~ /^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$/) exit 1
              n++
            }
            END { if (n < 100 || n > 12000) exit 1 }
          ' data/sni-candidates.txt
          duplicates=$(awk 'NF && $0 !~ /^[[:space:]]*#/ {print tolower($0)}' data/sni-candidates.txt | sort | uniq -d | wc -l)
          test "$duplicates" -eq 0
