name: Refresh latest stable core mirrors

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify upstream assets without changing the Release (set false to publish)"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: '43 6 * * 1'

permissions:
  contents: write

concurrency:
  group: stable-core-binaries
  cancel-in-progress: false

jobs:
  refresh:
    name: Verify and publish versioned stable core assets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CORE_MIRROR_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, pinned Node 24 runtime

      - name: Download and verify latest official stable assets
        shell: bash
        run: bash scripts/update-core-mirror.sh