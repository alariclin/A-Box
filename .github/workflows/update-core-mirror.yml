name: Refresh latest stable core mirrors

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify upstream assets without changing the Release (set false to publish)"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: '43 6 * * 1'
  pull_request:
    paths:
      - '.github/workflows/update-core-mirror.yml'
      - 'scripts/update-core-mirror.sh'

permissions:
  contents: read

concurrency:
  group: stable-core-binaries
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    name: Read-only core mirror dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CORE_MIRROR_DRY_RUN: '1'
      # P1-01 fix 2026-10-14: gh CLI needs token even for read-only API calls.
      # contents: read permission above ensures this token cannot write.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, pinned Node 24 runtime
        with:
          persist-credentials: false
      - name: Verify latest stable assets without publishing
        shell: bash
        run: bash scripts/update-core-mirror.sh

  # P1 fix 2026-10-14: split verification from publishing.
  # The verify-publish job downloads and EXECUTES upstream binaries, so it must
  # NOT have write permission or GH_TOKEN. The publish job only uploads
  # pre-verified artifacts and NEVER executes them.
  verify-publish:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
    name: Verify upstream binaries (isolated, read-only token)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CORE_MIRROR_DRY_RUN: '1'
      # P1-01 fix 2026-10-14: read-only token for gh API calls.
      # This job executes upstream binaries but token has no write permission.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, pinned Node 24 runtime
        with:
          persist-credentials: false
      - name: Download and verify latest official stable assets
        shell: bash
        # NOTE: GH_TOKEN is read-only (contents: read); upstream binaries
        # are executed here but cannot use it to write.
        run: bash scripts/update-core-mirror.sh
      - name: Upload verified artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21af51f82d3829fee7b13161676 # v4.4.3
        with:
          name: verified-core-mirror
          path: ${{ runner.temp }}/core-mirror/new/
          retention-days: 1

  # F-07: simulate publish-job verification logic on PRs (no real publish).
  # Tests the sha256sum -c + set-equality checks that the real publish job runs,
  # using fixture files. Catches publish-path bugs before they reach schedule/manual runs.
  publish-dry-run:
    if: ${{ github.event_name == 'pull_request' }}
    name: Publish verification simulation (fixture, no upload)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, pinned Node 24 runtime
        with:
          persist-credentials: false
      - name: Simulate publish verification with fixtures
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"; trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/verified"
          # Create fixture files mimicking a valid artifact.
          printf 'fixture-binary-content' > "$work/verified/Xray-test.zip"
          printf 'fixture-versions' > "$work/verified/CORE-VERSIONS"
          (cd "$work/verified" && sha256sum Xray-test.zip CORE-VERSIONS > SHA256SUMS.incoming)
          # Replicate publish job checks: sha256sum -c + exact set equality.
          (cd "$work/verified" && sha256sum -c SHA256SUMS.incoming) || { echo "FAIL: fixture checksum verification"; exit 1; }
          # Set equality: actual files must equal manifest-listed + control files.
          expected="$(printf 'CORE-VERSIONS\nSHA256SUMS.incoming\nXray-test.zip\n' | sort)"
          actual="$(cd "$work/verified" && find . -maxdepth 1 -mindepth 1 -printf '%f\n' | sort)"
          [[ "$actual" == "$expected" ]] || { echo "FAIL: set mismatch"; echo "actual: $actual"; echo "expected: $expected"; exit 1; }
          # Negative test: extra file must be rejected.
          printf 'evil' > "$work/verified/evil-injected.bin"
          actual2="$(cd "$work/verified" && find . -maxdepth 1 -mindepth 1 -printf '%f\n' | sort)"
          if [[ "$actual2" == "$expected" ]]; then echo "FAIL: extra file not detected"; exit 1; fi
          echo "OK: publish verification simulation passed (positive + negative)"

  publish:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
    name: Publish verified assets to Release (no binary execution)
    needs: verify-publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, pinned Node 24 runtime
        with:
          persist-credentials: false
      - name: Download verified artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: verified-core-mirror
          path: verified/
      # F-05: Detached Ed25519 signatures for mirror metadata.
      # Signs CORE-VERSIONS and SHA256SUMS with the maintainer private key
      # (GitHub Secret ABOX_SIGNING_PRIVKEY_B64 = base64 of raw 32-byte seed).
      # Skips gracefully when the secret is absent (forks / key-less CI).
      # See docs/SIGNING.md for key generation and rotation.
      - name: Sign mirror metadata (F-05)
        env:
          ABOX_SIGNING_PRIVKEY_B64: ${{ secrets.ABOX_SIGNING_PRIVKEY_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ABOX_SIGNING_PRIVKEY_B64:-}" ]]; then
            echo "::notice::ABOX_SIGNING_PRIVKEY_B64 not set; skipping F-05 signing."
            exit 0
          fi
          umask 077
          # Reconstruct PKCS#8 PEM from raw 32-byte seed (no new deps).
          python3 -c 'import base64,sys;raw=base64.b64decode(sys.argv[1],validate=True);assert len(raw)==32;der=bytes.fromhex("302e020100300506032b657004220420")+raw;sys.stdout.write("-----BEGIN PRIVATE KEY-----\n"+base64.encodebytes(der).decode().strip()+"\n-----END PRIVATE KEY-----\n")' "$ABOX_SIGNING_PRIVKEY_B64" > /tmp/abox-sign-priv.pem
          for meta in verified/CORE-VERSIONS verified/SHA256SUMS; do
            [[ -f "$meta" ]] || continue
            openssl pkeyutl -sign -inkey /tmp/abox-sign-priv.pem -rawin \
              -in "$meta" | base64 > "$meta.sig"
            # Self-check before upload: verify with the matching public key.
            openssl pkeyutl -verify -pubin \
              -inkey <(openssl pkey -in /tmp/abox-sign-priv.pem -pubout) \
              -rawin -in "$meta" \
              -sigfile <(base64 -d "$meta.sig") \
              || { echo "::error::F-05 self-check failed for $meta"; exit 1; }
            # H6: verify derived public key matches install.sh trust anchor
            derived_pub=$(openssl pkey -in /tmp/abox-sign-priv.pem -pubout 2>/dev/null | openssl pkey -pubin -outform DER 2>/dev/null | tail -c 32 | base64)
            expected_pub="7V4PBUUVpnfYhKu5LBxACxywpYEtvnDpVpvFnSrOujQ="
            if [[ "$derived_pub" != "$expected_pub" ]]; then
              echo "::error::Derived public key does not match install.sh trust anchor"
              exit 1
            fi
            echo "Signed: $meta.sig (pubkey verified)"
          done
          shred -u /tmp/abox-sign-priv.pem 2>/dev/null || rm -f /tmp/abox-sign-priv.pem
      - name: Upload to core-binaries Release (no execution)
        shell: bash
        # This job NEVER executes the downloaded binaries; it only uploads
        # files that were verified in the isolated verify-publish job.
        run: |
          set -euo pipefail
          # F-02 fix: independently re-verify every binary against the
          # OFFICIAL upstream Release digest before uploading anything.
          # Do NOT trust the manifest from the verify job alone.
          if [[ ! -f verified/SHA256SUMS.incoming ]]; then
            echo "ERROR: verified/SHA256SUMS.incoming missing; aborting"
            exit 1
          fi
          if [[ ! -f verified/CORE-VERSIONS ]]; then
            echo "ERROR: verified/CORE-VERSIONS missing; aborting"
            exit 1
          fi
          echo "Verifying artifact checksums against incoming manifest..."
          (cd verified && sha256sum -c SHA256SUMS.incoming) || {
            echo "ERROR: artifact checksum verification failed; aborting"
            exit 1
          }
          echo "Incoming manifest checksums passed."
          # Exact set equality: actual files in verified/ must equal exactly
          # {files listed in SHA256SUMS.incoming} + {SHA256SUMS, SHA256SUMS.incoming, CORE-VERSIONS}
          # + {CORE-VERSIONS.sig, SHA256SUMS.sig} when F-05 signing is enabled.
          # SHA256SUMS is the full merged Release manifest (historical + new);
          # SHA256SUMS.incoming is verification-only and is NOT uploaded.
          # Reject any extra or missing file.
          set_diff="$(comm -3 \
            <(cd verified && find . -maxdepth 1 -mindepth 1 -printf '%f\n' | sort) \
            <( { awk '{print $2}' verified/SHA256SUMS.incoming; printf '%s\n' SHA256SUMS SHA256SUMS.incoming CORE-VERSIONS; for s in CORE-VERSIONS.sig SHA256SUMS.sig; do [[ -f "verified/$s" ]] && printf '%s\n' "$s"; done; } | sort -u ))"
          if [[ -n "$set_diff" ]]; then
            echo "ERROR: verified/ file set does not exactly match expected set:"
            printf '%s\n' "$set_diff"
            exit 1
          fi
          echo "Artifact file set matches expected set exactly."
          # Independently verify each binary against upstream official digests.
          xray_tag="$(grep '^Xray=' verified/CORE-VERSIONS | cut -d= -f2)"
          singbox_tag="$(grep '^sing-box=' verified/CORE-VERSIONS | cut -d= -f2)"
          hysteria_tag="$(grep '^Hysteria=' verified/CORE-VERSIONS | cut -d= -f2)"
          cloudflared_tag="$(grep '^cloudflared=' verified/CORE-VERSIONS | cut -d= -f2)"
          wgcf_tag="$(grep '^wgcf=' verified/CORE-VERSIONS | cut -d= -f2)"
          [[ -n "$xray_tag" && -n "$singbox_tag" && -n "$hysteria_tag" && -n "$cloudflared_tag" && -n "$wgcf_tag" ]] || {
            echo "ERROR: CORE-VERSIONS missing core tags; aborting"
            exit 1
          }
          # A-01 fix: validate tag formats before interpolating into gh api
          # URLs. A malicious tag (e.g. containing ../) would enable path
          # traversal against the GitHub API.
          [[ "$xray_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "ERROR: invalid Xray tag format: $xray_tag; aborting"
            exit 1
          }
          [[ "$singbox_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "ERROR: invalid sing-box tag format: $singbox_tag; aborting"
            exit 1
          }
          [[ "$hysteria_tag" =~ ^app/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "ERROR: invalid Hysteria tag format: $hysteria_tag; aborting"
            exit 1
          }
          [[ "$cloudflared_tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "ERROR: invalid cloudflared tag format: $cloudflared_tag; aborting"
            exit 1
          }
          [[ "$wgcf_tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "ERROR: invalid wgcf tag format: $wgcf_tag; aborting"
            exit 1
          }
          hysteria_leaf="$(tr '/' '-' <<< "$hysteria_tag" | tr -d '\n')"
          verify_upstream_digest() {
            local name="$1" repo="$2" tag="$3" upstream="$4"
            local expected_digest actual
            # N-1-FIX: Use --arg to avoid jq program injection via $upstream (filename).
            # $name below is a jq variable (via --arg), not shell expansion.
            # --arg belongs to jq, not to gh api (gh rejects it as an
            # unknown flag), so fetch the JSON first and pipe it to jq.
            # shellcheck disable=SC2016
            expected_digest="$(gh api "repos/$repo/releases/tags/$tag" | jq -r --arg name "$upstream" '.assets[] | select(.name == $name) | .digest')"
            [[ "$expected_digest" =~ ^sha256:[A-Fa-f0-9]{64}$ ]] || {
              echo "ERROR: upstream has no valid digest for $repo:$tag/$upstream"
              return 1
            }
            actual="$(sha256sum "verified/$name" | awk '{print $1}')"
            [[ "sha256:${actual,,}" == "${expected_digest,,}" ]] || {
              echo "ERROR: verified/$name does not match upstream digest for $repo:$tag/$upstream"
              return 1
            }
            echo "Upstream digest OK: $name ($repo:$tag/$upstream)"
          }
          for f in verified/*; do
            [[ -f "$f" ]] || continue
            name="$(basename "$f")"
            case "$name" in
              Xray-*.zip)
                verify_upstream_digest "$name" "XTLS/Xray-core" "$xray_tag" "Xray-${name#Xray-"$xray_tag"-}"
                ;;
              sing-box-*.tar.gz)
                verify_upstream_digest "$name" "SagerNet/sing-box" "$singbox_tag" "$name"
                ;;
              hysteria-*)
                verify_upstream_digest "$name" "HyNetworks/hysteria" "$hysteria_tag" "hysteria-${name#hysteria-"$hysteria_leaf"-}"
                ;;
              cloudflared-*)
                verify_upstream_digest "$name" "cloudflare/cloudflared" "$cloudflared_tag" "cloudflared-${name#cloudflared-"$cloudflared_tag"-}"
                ;;
              wgcf_*)
                verify_upstream_digest "$name" "ViRb3/wgcf" "v$wgcf_tag" "$name"
                ;;
              SHA256SUMS|SHA256SUMS.incoming|CORE-VERSIONS|CORE-VERSIONS.sig|SHA256SUMS.sig)
                # Manifests/metadata: not upstream binaries, skip.
                ;;
              *)
                echo "ERROR: unknown file in artifact: $name; aborting"
                exit 1
                ;;
            esac
          done
          echo "All binaries independently verified against upstream official digests."
          # F-12 fix: Verify verified/SHA256SUMS (full merged manifest) entries.
          # For CORE-VERSIONS: digest must match sha256sum(verified/CORE-VERSIONS).
          # For files in verified/: digest must match sha256sum of the file.
          # For historical entries (not in verified/): digest must match GitHub
          # Release asset metadata. Prevents tampered manifest from being published.
          if [[ ! -f verified/SHA256SUMS ]]; then
            echo "ERROR: verified/SHA256SUMS missing; aborting"
            exit 1
          fi
          # F-12: Reject malformed SHA256SUMS lines before the verification loop
          # (empty lines, CRLF, wrong field count, bad hash, bad filename, duplicates).
          awk 'NF==0 || /\r$/ || NF != 2 || $1 !~ /^[A-Fa-f0-9]{64}$/ || $2 !~ /^[A-Za-z0-9._-]+$/ || seen[$2]++ { exit 1 }' verified/SHA256SUMS || {
            echo "ERROR: malformed SHA256SUMS (empty/CRLF/bad format/duplicate)"
            exit 1
          }
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/core-binaries")"
          cv_actual="$(sha256sum verified/CORE-VERSIONS | awk '{print $1}')"
          while read -r sum name extra || [[ -n "$sum" ]]; do
            [[ -n "${sum:-}" ]] || continue
            [[ -z "${extra:-}" && "$sum" =~ ^[A-Fa-f0-9]{64}$ && "$name" =~ ^[A-Za-z0-9._-]+$ ]] || {
              echo "ERROR: malformed SHA256SUMS line: $sum $name $extra"
              exit 1
            }
            if [[ "$name" == "CORE-VERSIONS" ]]; then
              [[ "${sum,,}" == "${cv_actual,,}" ]] || {
                echo "ERROR: CORE-VERSIONS digest mismatch in SHA256SUMS"
                exit 1
              }
            elif [[ -f "verified/$name" ]]; then
              f_actual="$(sha256sum "verified/$name" | awk '{print $1}')"
              [[ "${sum,,}" == "${f_actual,,}" ]] || {
                echo "ERROR: incoming digest mismatch for $name"
                exit 1
              }
            else
              gh_digest="$(jq -er --arg n "$name" '[.assets[]? | select(.name == $n)] | if length == 1 then .[0].digest // empty else empty end' <<< "$release_json")"
              [[ "${gh_digest#sha256:}" == "$sum" ]] || {
                echo "ERROR: historical SHA256SUMS entry tampered: $name"
                exit 1
              }
            fi
          done < verified/SHA256SUMS
          echo "SHA256SUMS manifest verified (CORE-VERSIONS + incoming + historical)."
          # U61: reverse coverage — every verified binary must appear exactly
          # once in the full SHA256SUMS with a matching digest, or a binary
          # dropped from the manifest during merge would still be uploaded
          # and published without a manifest record.
          echo "Reverse coverage check: every verified binary must be listed in SHA256SUMS."
          for f in verified/*; do
            [[ -f "$f" ]] || continue
            name=$(basename "$f")
            case "$name" in SHA256SUMS|SHA256SUMS.incoming|CORE-VERSIONS|CORE-VERSIONS.sig|SHA256SUMS.sig) continue ;; esac
            case "$name" in Xray-*.zip|sing-box-*.tar.gz|hysteria-*|cloudflared-*|wgcf_*) ;; *) continue ;; esac
            rec_count=$(awk -v n="$name" '$2 == n' verified/SHA256SUMS | wc -l)
            [[ "$rec_count" -eq 1 ]] || { echo "ERROR: $name has $rec_count records in SHA256SUMS (expected exactly 1); aborting"; exit 1; }
            rec_sum=$(awk -v n="$name" '$2 == n {print $1}' verified/SHA256SUMS)
            f_actual=$(sha256sum "verified/$name" | awk '{print $1}')
            [[ "${rec_sum,,}" == "${f_actual,,}" ]] || { echo "ERROR: SHA256SUMS digest mismatch for $name"; exit 1; }
          done
          # Upload order is binaries -> CORE-VERSIONS -> SHA256SUMS (full) last.
          # SHA256SUMS.incoming is verification-only and is NOT uploaded.
          for f in verified/*; do
            [[ -f "$f" ]] || continue
            name=$(basename "$f")
            case "$name" in
              SHA256SUMS|SHA256SUMS.incoming|CORE-VERSIONS|CORE-VERSIONS.sig|SHA256SUMS.sig) continue ;;
            esac
            # Improvement 2026-10-14: whitelist known binary patterns.
            case "$name" in
              Xray-*.zip|sing-box-*.tar.gz|hysteria-*|cloudflared-*|wgcf_*) ;;
              *) echo "ERROR: unknown file in artifact: $name; aborting"; exit 1 ;;
            esac
            echo "Uploading binary: $name"
            gh release upload core-binaries "$f#$name" --clobber
          done
          if [[ -f verified/CORE-VERSIONS ]]; then
            echo "Uploading CORE-VERSIONS"
            gh release upload core-binaries "verified/CORE-VERSIONS#CORE-VERSIONS" --clobber
            # F-05: upload detached signature if the signing step produced one.
            if [[ -f verified/CORE-VERSIONS.sig ]]; then
              gh release upload core-binaries "verified/CORE-VERSIONS.sig#CORE-VERSIONS.sig" --clobber
            fi
          fi
          echo "Uploading SHA256SUMS (last)"
          gh release upload core-binaries "verified/SHA256SUMS#SHA256SUMS" --clobber
          if [[ -f verified/SHA256SUMS.sig ]]; then
            gh release upload core-binaries "verified/SHA256SUMS.sig#SHA256SUMS.sig" --clobber
          fi
          echo "Publish complete. Verified assets uploaded without execution."
