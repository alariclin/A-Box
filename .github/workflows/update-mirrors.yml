name: Update stable recovery mirrors

on:
  workflow_dispatch:
    inputs:
      refresh_test_tool_mirror:
        description: "Refresh mutable third-party shell tools after reviewing upstream changes"
        type: boolean
        required: false
        default: false
      known_good_sha256:
        description: "Space-separated 'bench.sh=<sha256> Check.Place.sh=<sha256> acheck.py=<sha256>' after manual review"
        type: string
        required: false
        default: ""
  schedule:
    - cron: '17 5 * * 1'
  pull_request:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-mirrors.yml'

permissions:
  contents: read

concurrency:
  group: stable-recovery-mirrors
  cancel-in-progress: false

jobs:
  update-mirrors:
    name: Build, verify, and publish recovery assets
    # P3-12 fix: never run the publishing job on pull requests; only the
    # read-only dry-run-validate job runs on PRs.
    if: ${{ github.event_name != 'pull_request' }}
    # N-13 fix: write permission scoped to this job only, not the whole workflow.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # F-05: Ed25519 signing key for mirror metadata (base64 raw 32-byte seed).
      # Absent in forks: Wallos signing fails closed (refuses to publish
      # unsigned manifests); test-tools signing fails on manual dispatch
      # and skips with a notice only on scheduled runs.
      ABOX_SIGNING_PRIVKEY_B64: ${{ secrets.ABOX_SIGNING_PRIVKEY_B64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, pinned Node 24 runtime
        with:
          persist-credentials: false

      - name: Prepare Wallos source and multi-architecture Docker archives
        id: wallos_assets
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$GITHUB_WORKSPACE/dist/wallos"
          mkdir -p "$out"
          cd "$out"

          release_json="$(gh api repos/ellite/Wallos/releases/latest)"
          tag="$(jq -er '.tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' <<<"$release_json")"
          image_tag="${tag#v}"

          echo "Wallos stable release: $tag"
          # P3-10 fix: verify provenance of the source tarball. Resolve the
          # tag to its commit SHA via the GitHub API, then download from the
          # SHA-based archive URL (not the tag-based URL). GitHub redirects
          # tag URLs to codeload .../tar.gz/refs/tags/<tag> (tag, never SHA),
          # so a redirect check against the SHA always fails on tag URLs.
          # The SHA URL redirects to .../tar.gz/<sha>, and the check below
          # confirms the redirect target contains the expected SHA. This
          # proves the tarball came from the tagged commit; it is NOT a
          # content-hash check against an expected value.
          tag_commit_sha="$(gh api "repos/ellite/Wallos/commits/${tag}" --jq '.sha')"
          [[ "$tag_commit_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not resolve Wallos tag $tag to a commit SHA"
            exit 1
          }
          source_url="https://github.com/ellite/Wallos/archive/${tag_commit_sha}.tar.gz"
          effective_url="$(curl -fsSL -o /dev/null -w '%{url_effective}' "$source_url")"
          [[ "$effective_url" == *"$tag_commit_sha"* ]] || {
            echo "::error::Wallos source URL does not resolve to commit $tag_commit_sha (got $effective_url)"
            exit 1
          }
          curl -fL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 300 \
            "$source_url" -o wallos-source.tar.gz
          gzip -t wallos-source.tar.gz
          tar -tzf wallos-source.tar.gz > "$RUNNER_TEMP/wallos-source-list.txt"
          grep -Eq '(^|/)LICENSE\.md$' "$RUNNER_TEMP/wallos-source-list.txt" || {
            echo "::error::Wallos source archive does not contain LICENSE.md"
            exit 1
          }

          # Digest pin (Wallos arm64 failure, 2026-11-06): resolve the
          # multi-arch index ONCE and pin each platform's child manifest
          # digest. Tag-based pulls are ambiguous across Docker image
          # stores: on a containerd-backed store (ubuntu-26.04 runners)
          # an unqualified `docker image inspect <tag>` resolves the index
          # to the daemon's default platform (amd64), so the architecture
          # check failed even though the arm64 content exists upstream.
          # A digest reference identifies exactly one platform manifest
          # on every store. Never fall back to RepoDigests[0]: on a
          # multi-arch store it is the shared index digest, not the
          # platform digest.
          index_json="$(docker buildx imagetools inspect "bellamy/wallos:${image_tag}" --raw)"
          for spec in "amd64:linux/amd64" "arm64:linux/arm64" "armv7:linux/arm/v7"; do
            arch="${spec%%:*}"; platform="${spec#*:}"
            child_digest="$(jq -r --arg p "$platform" '.manifests[] | select(.platform and ((.platform.os + "/" + .platform.architecture + (if .platform.variant then "/" + .platform.variant else "" end)) == $p)) | .digest' <<<"$index_json")"
            [[ "$child_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::Could not resolve $platform child digest for bellamy/wallos:${image_tag}"
              exit 1
            }
            printf -v "digest_${arch}" '%s' "$child_digest"
          done

          pull_save_image() {
            # Args: $1 arch, $2 platform, $3 image digest, $4 image tag,
            # $5 asset filename. (L3-11-15: versioned builds pass their own
            # tag + versioned asset name; the unversioned build passes the
            # latest tag + fixed asset name.)
            local arch="$1" platform="$2" image_digest="$3" ver_tag="$4" asset="$5"
            local image="bellamy/wallos:${ver_tag}"
            local actual image_ref
            image_ref="${image}@${image_digest}"
            echo "Pulling ${image_ref} for ${platform}"
            docker pull --platform "$platform" "$image_ref"
            actual="$(docker image inspect --platform "$platform" --format '{{.Os}}/{{.Architecture}}{{if .Variant}}/{{.Variant}}{{end}}' "$image_ref")"
            if [[ "$actual" != "$platform" ]]; then
              echo "::error::Expected ${platform}, but Docker inspected ${actual}"
              exit 1
            fi
            docker save "$image_ref" | gzip -1 > "$asset"
            gzip -t "$asset"
            test -s "$asset"
          }

          pull_save_image amd64 linux/amd64 "${digest_amd64}" "${image_tag}" "wallos-linux-amd64.tar.gz"
          pull_save_image arm64 linux/arm64 "${digest_arm64}" "${image_tag}" "wallos-linux-arm64.tar.gz"
          pull_save_image armv7 linux/arm/v7 "${digest_armv7}" "${image_tag}" "wallos-linux-armv7.tar.gz"

          retrieved_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          {
            printf 'tag=%s\n' "${tag}"
            printf 'image=bellamy/wallos\n'
            printf 'image_tag=%s\n' "${image_tag}"
            printf 'image_digest.amd64=%s\n' "${digest_amd64}"
            printf 'image_digest.arm64=%s\n' "${digest_arm64}"
            printf 'image_digest.armv7=%s\n' "${digest_armv7}"
            printf 'source_url=%s\n' "${source_url}"
            printf 'retrieved_at_utc=%s\n' "${retrieved_at}"
            printf 'platform.amd64=linux/amd64\n'
            printf 'platform.arm64=linux/arm64\n'
            printf 'platform.armv7=linux/arm/v7\n'
          } > wallos-manifest.txt

          # D-2: Include wallos-manifest.txt in SHA256SUMS so consumers can
          # verify the manifest itself (previously only 4 tar.gz files were listed).
          # FIX: Hash ONLY the 4 tarballs first (NOT the manifest), because the
          # manifest is mutated below (SHA lines appended). Hashing the manifest
          # before mutation would record a stale hash and break the line count.
          sha256sum wallos-source.tar.gz \
            wallos-linux-amd64.tar.gz \
            wallos-linux-arm64.tar.gz \
            wallos-linux-armv7.tar.gz > SHA256SUMS

          {
            echo "source_sha256=$(awk '$2=="wallos-source.tar.gz" {print $1}' SHA256SUMS)"
            echo "amd64_sha256=$(awk '$2=="wallos-linux-amd64.tar.gz" {print $1}' SHA256SUMS)"
            echo "arm64_sha256=$(awk '$2=="wallos-linux-arm64.tar.gz" {print $1}' SHA256SUMS)"
            echo "armv7_sha256=$(awk '$2=="wallos-linux-armv7.tar.gz" {print $1}' SHA256SUMS)"
          } >> wallos-manifest.txt


          # Boundary 2: Add final manifest (after SHA appends) to SHA256SUMS.
          # Client verifies manifest hash against SHA256SUMS (D-2 fail-closed).
          # The manifest hash recorded here is the FINAL content (post-append).
          # Total unversioned: 4 tarballs + final manifest = 5 lines; the
          # versioned block below extends SHA256SUMS further.
          sha256sum wallos-manifest.txt >> SHA256SUMS

          # L3-11-15: per-version rollback assets. The installer rollback
          # path fetches wallos-versions.txt, wallos-manifest-vX.Y.Z.txt and
          # wallos-linux-$arch-vX.Y.Z.tar.gz; the single unversioned asset
          # set above cannot serve a multi-version list, so a mirror that
          # only publishes it makes every rollback 404 (L3-11-15).
          # Retained set = latest 3 stable upstream releases + any version
          # already published as a per-version manifest (never drop one).
          # Builds are incremental: a version whose manifest + 3 archives
          # are already on the release, with SHA256SUMS records, is skipped
          # and its records are carried over verbatim.
          _mirror_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/wallos-mirror"
          _mirror_pubkey_b64='7V4PBUUVpnfYhKu5LBxACxywpYEtvnDpVpvFnSrOujQ='
          _existing_assets=''
          if gh release view wallos-mirror --json assets --jq '.assets[].name' > "$RUNNER_TEMP/wallos-existing-assets.txt" 2>/dev/null; then
            _existing_assets="$(cat "$RUNNER_TEMP/wallos-existing-assets.txt")"
          fi
          # No `head -n 3` in the pipeline: a closed pipe can SIGPIPE the
          # producer under pipefail. Slice the array instead.
          mapfile -t _all_stable_tags < <(gh api repos/ellite/Wallos/releases --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' | grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$')
          ((${#_all_stable_tags[@]} >= 3)) || { echo "::error::expected at least 3 stable Wallos releases, got ${#_all_stable_tags[@]}"; exit 1; }
          _latest_tags=("${_all_stable_tags[@]:0:3}")
          mapfile -t _published_tags < <(printf '%s\n' "$_existing_assets" | grep -oE '^wallos-manifest-v[0-9]+[.][0-9]+[.][0-9]+[.]txt$' | sed -E 's/^wallos-manifest-//; s/[.]txt$//' | sort -u || true)
          _retained_input=()
          _retained_input+=("${_latest_tags[@]}")
          if ((${#_published_tags[@]} > 0)); then
            _retained_input+=("${_published_tags[@]}")
          fi
          mapfile -t _retained_tags < <(printf '%s\n' "${_retained_input[@]}" | grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' | sort -u | sort -rV)
          ((${#_retained_tags[@]} >= 1)) || { echo "::error::no retained Wallos versions"; exit 1; }
          # Only a release that already carries per-version manifests needs
          # its SHA256SUMS carried over; verify its signature first
          # (R11C19-01 pattern) before trusting any carried record.
          _existing_sums=''
          if ((${#_published_tags[@]} > 0)); then
            curl -fLsS --connect-timeout 10 --max-time 60 "$_mirror_base/SHA256SUMS" -o "$RUNNER_TEMP/wallos-existing-SHA256SUMS" || { echo "::error::cannot fetch existing wallos-mirror SHA256SUMS for record carry-over"; exit 1; }
            _existing_sums="$RUNNER_TEMP/wallos-existing-SHA256SUMS"
            curl -fLsS --connect-timeout 10 --max-time 60 "$_mirror_base/SHA256SUMS.sig" -o "$RUNNER_TEMP/wallos-existing-SHA256SUMS.sig" || { echo "::error::existing wallos-mirror SHA256SUMS.sig missing; refusing to carry unverified records"; exit 1; }
            python3 -c 'import base64,sys;raw=base64.b64decode(sys.argv[1],validate=True);assert len(raw)==32;der=bytes.fromhex("302a300506032b6570032100")+raw;sys.stdout.write("-----BEGIN PUBLIC KEY-----\n"+base64.encodebytes(der).decode().strip()+"\n-----END PUBLIC KEY-----\n")' \
              "$_mirror_pubkey_b64" > /tmp/abox-verify-pub.pem
            openssl pkeyutl -verify -pubin -inkey /tmp/abox-verify-pub.pem \
              -rawin -in "$_existing_sums" \
              -sigfile <(base64 -d "$RUNNER_TEMP/wallos-existing-SHA256SUMS.sig") \
              || { echo "::error::existing wallos-mirror SHA256SUMS signature does not verify; refusing to carry records"; exit 1; }
            echo "Existing wallos-mirror SHA256SUMS signature verified."
          fi
          _ver_built=0
          for _vtag in "${_retained_tags[@]}"; do
            _ver_manifest="wallos-manifest-${_vtag}.txt"
            _ver_image_tag="${_vtag#v}"
            _skip=0
            if [[ -n "$_existing_sums" ]]; then
              _skip=1
              for _f in "$_ver_manifest" "wallos-linux-amd64-${_vtag}.tar.gz" "wallos-linux-arm64-${_vtag}.tar.gz" "wallos-linux-armv7-${_vtag}.tar.gz"; do
                grep -qxF "$_f" <<<"$_existing_assets" || _skip=0
                awk -v f="$_f" '$2==f {found=1} END {exit !found}' "$_existing_sums" || _skip=0
              done
            fi
            if (( _skip == 1 )); then
              for _f in "$_ver_manifest" "wallos-linux-amd64-${_vtag}.tar.gz" "wallos-linux-arm64-${_vtag}.tar.gz" "wallos-linux-armv7-${_vtag}.tar.gz"; do
                awk -v f="$_f" '$2==f {print}' "$_existing_sums" >> SHA256SUMS
              done
              echo "Keeping published ${_vtag} (already on wallos-mirror)"
              continue
            fi
            echo "Building versioned assets for ${_vtag}"
            _ver_index_json="$(docker buildx imagetools inspect "bellamy/wallos:${_ver_image_tag}" --raw)"
            for _spec in "amd64:linux/amd64" "arm64:linux/arm64" "armv7:linux/arm/v7"; do
              _arch="${_spec%%:*}"; _platform="${_spec#*:}"
              _child="$(jq -r --arg p "$_platform" '.manifests[] | select(.platform and ((.platform.os + "/" + .platform.architecture + (if .platform.variant then "/" + .platform.variant else "" end)) == $p)) | .digest' <<<"$_ver_index_json")"
              [[ "$_child" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Could not resolve $_platform child digest for bellamy/wallos:${_ver_image_tag}"; exit 1; }
              printf -v "_ver_digest_${_arch}" '%s' "$_child"
            done
            pull_save_image amd64 linux/amd64 "${_ver_digest_amd64}" "${_ver_image_tag}" "wallos-linux-amd64-${_vtag}.tar.gz"
            pull_save_image arm64 linux/arm64 "${_ver_digest_arm64}" "${_ver_image_tag}" "wallos-linux-arm64-${_vtag}.tar.gz"
            pull_save_image armv7 linux/arm/v7 "${_ver_digest_armv7}" "${_ver_image_tag}" "wallos-linux-armv7-${_vtag}.tar.gz"
            _ver_source_sha="$(gh api "repos/ellite/Wallos/commits/${_vtag}" --jq '.sha')"
            [[ "$_ver_source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Could not resolve Wallos tag $_vtag to a commit SHA"; exit 1; }
            _ver_source_url="https://github.com/ellite/Wallos/archive/${_ver_source_sha}.tar.gz"
            _ver_retrieved_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            {
              printf 'tag=%s\n' "$_vtag"
              printf 'image=bellamy/wallos\n'
              printf 'image_tag=%s\n' "$_ver_image_tag"
              printf 'image_digest.amd64=%s\n' "$_ver_digest_amd64"
              printf 'image_digest.arm64=%s\n' "$_ver_digest_arm64"
              printf 'image_digest.armv7=%s\n' "$_ver_digest_armv7"
              printf 'source_url=%s\n' "$_ver_source_url"
              printf 'retrieved_at_utc=%s\n' "$_ver_retrieved_at"
              printf 'platform.amd64=linux/amd64\n'
              printf 'platform.arm64=linux/arm64\n'
              printf 'platform.armv7=linux/arm/v7\n'
            } > "$_ver_manifest"
            {
              echo "amd64_sha256=$(sha256sum "wallos-linux-amd64-${_vtag}.tar.gz" | awk '{print $1}')"
              echo "arm64_sha256=$(sha256sum "wallos-linux-arm64-${_vtag}.tar.gz" | awk '{print $1}')"
              echo "armv7_sha256=$(sha256sum "wallos-linux-armv7-${_vtag}.tar.gz" | awk '{print $1}')"
            } >> "$_ver_manifest"
            sha256sum "$_ver_manifest" "wallos-linux-amd64-${_vtag}.tar.gz" "wallos-linux-arm64-${_vtag}.tar.gz" "wallos-linux-armv7-${_vtag}.tar.gz" >> SHA256SUMS
            _ver_built=$((_ver_built + 1))
          done
          printf '%s\n' "${_retained_tags[@]}" > wallos-versions.txt
          sha256sum wallos-versions.txt >> SHA256SUMS

          # Total: 5 unversioned + 1 versions list + 4 per retained version.
          _expected_sums=$((5 + 1 + 4 * ${#_retained_tags[@]}))
          test "$(grep -cE '^[A-Fa-f0-9]{64}  ' SHA256SUMS)" -eq "$_expected_sums"
          # Verify hashes of files actually present in this build dir.
          # Carried records point at assets already on the release, so a
          # full `sha256sum -c` would fail on their absence here; verify
          # the present subset instead.
          : > "$RUNNER_TEMP/SHA256SUMS.present"
          while IFS= read -r _line; do
            _f="${_line#*  }"
            if [[ -f "$_f" ]]; then
              printf '%s\n' "$_line" >> "$RUNNER_TEMP/SHA256SUMS.present"
            fi
          done < SHA256SUMS
          sha256sum -c "$RUNNER_TEMP/SHA256SUMS.present"
          test "$(grep -cE '^[A-Fa-f0-9]{64}  ' "$RUNNER_TEMP/SHA256SUMS.present")" -eq "$((5 + 1 + 4 * _ver_built))"
          echo "Wallos versioned assets: retained=${#_retained_tags[@]} built=${_ver_built} versions: ${_retained_tags[*]}"

          # F-05: Detached Ed25519 signatures for wallos-manifest.txt and
          # SHA256SUMS (same pattern as update-core-mirror.yml F-05).
          # Uses ABOX_SIGNING_PRIVKEY_B64 secret; fails if absent
          # (R6C19-03): skipping let the publish step upload a
          # new SHA256SUMS with the old .sig left behind.
          # See docs/SIGNING.md.
          if [[ -n "${ABOX_SIGNING_PRIVKEY_B64:-}" ]]; then
            umask 077
            python3 -c 'import base64,sys;raw=base64.b64decode(sys.argv[1],validate=True);assert len(raw)==32;der=bytes.fromhex("302e020100300506032b657004220420")+raw;sys.stdout.write("-----BEGIN PRIVATE KEY-----\n"+base64.encodebytes(der).decode().strip()+"\n-----END PRIVATE KEY-----\n")' "$ABOX_SIGNING_PRIVKEY_B64" > /tmp/abox-sign-priv.pem
            openssl pkeyutl -sign -inkey /tmp/abox-sign-priv.pem -rawin \
              -in wallos-manifest.txt | base64 > wallos-manifest.txt.sig
            openssl pkeyutl -verify -pubin \
              -inkey <(openssl pkey -in /tmp/abox-sign-priv.pem -pubout) \
              -rawin -in wallos-manifest.txt \
              -sigfile <(base64 -d wallos-manifest.txt.sig) \
              || { echo "ERROR: F-05 self-check failed for wallos-manifest.txt"; exit 1; }
            echo "Signed: wallos-manifest.txt.sig"
            openssl pkeyutl -sign -inkey /tmp/abox-sign-priv.pem -rawin \
              -in SHA256SUMS | base64 > SHA256SUMS.sig
            openssl pkeyutl -verify -pubin \
              -inkey <(openssl pkey -in /tmp/abox-sign-priv.pem -pubout) \
              -rawin -in SHA256SUMS \
              -sigfile <(base64 -d SHA256SUMS.sig) \
              || { echo "ERROR: F-05 self-check failed for SHA256SUMS"; exit 1; }
            # H6: verify derived public key matches install.sh trust anchor
            derived_pub=$(openssl pkey -in /tmp/abox-sign-priv.pem -pubout 2>/dev/null | openssl pkey -pubin -outform DER 2>/dev/null | tail -c 32 | base64)
            expected_pub="7V4PBUUVpnfYhKu5LBxACxywpYEtvnDpVpvFnSrOujQ="
            if [[ "$derived_pub" != "$expected_pub" ]]; then
              echo "ERROR: Derived public key does not match install.sh trust anchor"; exit 1
            fi
            echo "Signed: SHA256SUMS.sig"
            shred -u /tmp/abox-sign-priv.pem 2>/dev/null || rm -f /tmp/abox-sign-priv.pem
          else
            echo "::error::ABOX_SIGNING_PRIVKEY_B64 not set; refusing to publish unsigned Wallos manifests."
            exit 1
          fi

      - name: Prepare benchmark, IP-quality and A-Check tool mirror
        id: test_tool_assets
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_test_tool_mirror
        shell: bash
        # FINAL-AUDIT fix: pass the workflow_dispatch input via env: so the
        # value is never interpolated into the run: script text. Direct
        # ${{ inputs... }} interpolation inside double quotes lets a malicious
        # input's $(...) / backticks execute before format validation runs.
        env:
          KNOWN_GOOD_SHA256_INPUT: ${{ inputs.known_good_sha256 }}
        run: |
          set -Eeuo pipefail
          # SECURITY: These scripts are downloaded from mutable upstream URLs.
          # The SHA256SUMS generated below is self-attestation, NOT independent
          # verification. Before first use of a new upstream version, a human
          # MUST manually review the diff. Do not auto-approve.
          # Test-tools FIX: KNOWN_GOOD_SHA256 is now REQUIRED (was optional).
          # Mutable upstream scripts must be pinned to human-reviewed hashes
          # before publishing. Empty value aborts the build.
          KNOWN_GOOD_SHA256="${KNOWN_GOOD_SHA256:-${KNOWN_GOOD_SHA256_INPUT:-}}"
          [[ -n "$KNOWN_GOOD_SHA256" ]] || {
            echo "::error::KNOWN_GOOD_SHA256 is required (bench.sh=<sha256> Check.Place.sh=<sha256> acheck.py=<sha256>)"
            exit 1
          }
          # Argon: Validate each pin format (allowed file + 64-hex SHA) and
          # compare case-insensitively. Require both bench.sh and Check.Place.sh.
          declare -A seen_pins=()
          read -ra pinned_entries <<< "$KNOWN_GOOD_SHA256"
          for entry in "${pinned_entries[@]}"; do
            pinned_file="${entry%%=*}"
            pinned_sha="${entry#*=}"
            case "$pinned_file" in bench.sh|Check.Place.sh|acheck.py|YABS-LICENSE|IPQuality-LICENSE) ;; *)
              echo "::error::Unexpected file in KNOWN_GOOD_SHA256: $pinned_file"; exit 1 ;;
            esac
            [[ "$pinned_sha" =~ ^[A-Fa-f0-9]{64}$ ]] || {
              echo "::error::Invalid SHA-256 format for $pinned_file: $pinned_sha"; exit 1
            }
            seen_pins["$pinned_file"]=1
          done
          [[ -n "${seen_pins[bench.sh]:-}" && -n "${seen_pins[Check.Place.sh]:-}" && -n "${seen_pins[acheck.py]:-}" ]] || {
            echo "::error::KNOWN_GOOD_SHA256 must pin bench.sh, Check.Place.sh and acheck.py"
            exit 1
          }
          out="$GITHUB_WORKSPACE/dist/test-tools"
          mkdir -p "$out"
          cd "$out"

          bench_url='https://bench.sh'
          ipquality_url='https://Check.Place'
          yabs_license_url='https://raw.githubusercontent.com/masonr/yet-another-bench-script/master/LICENSE'
          ipquality_license_url='https://raw.githubusercontent.com/xykt/ScriptMenu/main/LICENSE'
          acheck_url='https://raw.githubusercontent.com/alariclin/A-Check/main/acheck.py'

          curl -fL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 180 "$bench_url" -o bench.sh
          curl -fL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 180 "$ipquality_url" -o Check.Place.sh
          curl -fL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 60 "$yabs_license_url" -o YABS-LICENSE
          curl -fL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 60 "$ipquality_license_url" -o IPQuality-LICENSE
          curl -fL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 180 "$acheck_url" -o acheck.py

          validate_shell_script() {
            local file="$1" bytes first_line
            bytes="$(wc -c < "$file" | tr -d '[:space:]')"
            first_line="$(head -n 1 "$file")"
            if (( bytes < 1000 || bytes > 2000000 )); then
              echo "::error::Unexpected size for ${file}: ${bytes} bytes"
              return 1
            fi
            if [[ ! "$first_line" =~ ^#!.*bash([[:space:]]|$) ]] || grep -Eiq '<!doctype[[:space:]]+html|<html([[:space:]>])' "$file"; then
              echo "::error::Refusing unexpected/non-shell content in ${file}"
              return 1
            fi
            bash -n "$file"
          }

          validate_shell_script bench.sh
          validate_shell_script Check.Place.sh
          # acheck.py is a Python tool: sizeable, python3 shebang, compiles.
          (( $(wc -c < acheck.py) >= 100000 )) || { echo "::error::acheck.py unexpectedly small"; exit 1; }
          head -n 1 acheck.py | grep -qx '#!/usr/bin/env python3' || { echo "::error::acheck.py shebang mismatch"; exit 1; }
          grep -Eq '^VERSION = "[0-9]+\.[0-9]+\.[0-9]+"' acheck.py || { echo "::error::acheck.py VERSION marker missing"; exit 1; }
          python3 -m py_compile acheck.py
          test "$(wc -c < YABS-LICENSE)" -gt 100
          grep -Fq 'DO WHAT THE FUCK YOU WANT TO PUBLIC LICENSE' YABS-LICENSE
          test "$(wc -c < IPQuality-LICENSE)" -gt 1000

          # P2-2 fix: REQUIRED pin check (KNOWN_GOOD_SHA256 validated above).
          # Verify each downloaded file against the pinned hashes.
          if [[ -n "${KNOWN_GOOD_SHA256:-}" ]]; then
            read -ra pinned_entries <<< "$KNOWN_GOOD_SHA256"
            for entry in "${pinned_entries[@]}"; do
              pinned_file="${entry%%=*}"
              pinned_sha="${entry#*=}"
              actual_sha="$(sha256sum "$pinned_file" | awk '{print $1}')"
              [[ "${actual_sha,,}" == "${pinned_sha,,}" ]] || {
                echo "::error::KNOWN_GOOD_SHA256 mismatch for $pinned_file"
                exit 1
              }
            done
            echo "KNOWN_GOOD_SHA256 pin check passed."
          fi

          retrieved_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          {
            printf 'retrieved_at_utc=%s\n' "${retrieved_at}"
            printf 'bench.sh.url=%s\n' "${bench_url}"
            printf 'Check.Place.sh.url=%s\n' "${ipquality_url}"
            printf 'YABS-LICENSE.url=%s\n' "${yabs_license_url}"
            printf 'IPQuality-LICENSE.url=%s\n' "${ipquality_license_url}"
            printf 'acheck.py.url=%s\n' "${acheck_url}"
            printf 'validation=non-empty;size-bounds;shebang;no-html-signature;bash-n\n'
          } > test-tools-manifest.txt
          sha256sum bench.sh Check.Place.sh acheck.py YABS-LICENSE IPQuality-LICENSE test-tools-manifest.txt > SHA256SUMS
          sha256sum -c SHA256SUMS
          # P3-02: Sign SHA256SUMS for test-tools (Ed25519)
          if [[ -n "${ABOX_SIGNING_PRIVKEY_B64:-}" ]]; then
            umask 077
            python3 -c 'import base64,sys;raw=base64.b64decode(sys.argv[1],validate=True);assert len(raw)==32;der=bytes.fromhex("302e020100300506032b657004220420")+raw;sys.stdout.write("-----BEGIN PRIVATE KEY-----\n"+base64.encodebytes(der).decode().strip()+"\n-----END PRIVATE KEY-----\n")' "$ABOX_SIGNING_PRIVKEY_B64" > /tmp/abox-sign-priv.pem
            openssl pkeyutl -sign -inkey /tmp/abox-sign-priv.pem -rawin -in SHA256SUMS | base64 > SHA256SUMS.sig
            openssl pkeyutl -verify -pubin -inkey <(openssl pkey -in /tmp/abox-sign-priv.pem -pubout) -rawin -in SHA256SUMS -sigfile <(base64 -d SHA256SUMS.sig) || { echo "::error::test-tools SHA256SUMS self-check failed"; exit 1; }
            # Verify derived public key matches install.sh trust anchor
            derived_pub=$(openssl pkey -in /tmp/abox-sign-priv.pem -pubout 2>/dev/null | openssl pkey -pubin -outform DER 2>/dev/null | tail -c 32 | base64)
            expected_pub="7V4PBUUVpnfYhKu5LBxACxywpYEtvnDpVpvFnSrOujQ="
            if [[ "$derived_pub" != "$expected_pub" ]]; then
              echo "::error::Derived public key does not match install.sh trust anchor"
              exit 1
            fi
            echo "Signed: SHA256SUMS.sig (pubkey verified)"
            shred -u /tmp/abox-sign-priv.pem 2>/dev/null || rm -f /tmp/abox-sign-priv.pem
          else
            # Fail on manual trigger, notice on scheduled run
            if [[ "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]; then
              echo "::error::ABOX_SIGNING_PRIVKEY_B64 not set; cannot publish unsigned test-tools"
              exit 1
            fi
            echo "::notice::ABOX_SIGNING_PRIVKEY_B64 not set; skipping test-tools signing."
          fi

      - name: Publish Wallos stable recovery Release
        if: always() && steps.wallos_assets.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          publish_release() {
            local tag="$1" title="$2" notes_file="$3" asset_dir="$4"
            mapfile -t all_assets < <(find "$asset_dir" -maxdepth 1 -type f -print | sort)
            assets=()
            for asset in "${all_assets[@]}"; do
              [[ "$(basename "$asset")" == SHA256SUMS ]] || assets+=("$asset")
            done
            if (("${#assets[@]}" == 0)); then
              echo "::error::No assets found for ${tag}"
              return 1
            fi

            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --draft --target "$GITHUB_SHA" \
                --title "$title" --notes-file "$notes_file"
            fi

            gh release edit "$tag" --title "$title" --notes-file "$notes_file"
            # Upload payload first and SHA256SUMS last. A partial update then fails closed
            # against the previous manifest instead of publishing a new manifest early.
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release upload "$tag" "$asset_dir/SHA256SUMS" --clobber

            gh release edit "$tag" --draft=false --latest=false
            echo "Published ${title}: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
          }

          notes="$RUNNER_TEMP/wallos-notes.md"
          {
            printf 'Stable, fixed-name recovery assets for the Wallos installer.\n'
            printf 'The installer uses this Release only when upstream stable-release metadata or Docker Hub retrieval fails.\n'
            printf 'Assets include Docker image archives for amd64, arm64, and armv7, the upstream source archive, a manifest, and SHA256SUMS.\n'
            printf "Rollback assets: wallos-versions.txt, one wallos-manifest-vX.Y.Z.txt per retained version, and wallos-linux-\$arch-vX.Y.Z.tar.gz archives, all recorded in SHA256SUMS.\n"
            printf 'The publishing workflow verifies archive integrity, platform identity, and SHA-256 before upload.\n'
          } > "$notes"
          # R6C19-03: last gate before publish: both signatures
          # must exist in the asset dir.
          for _sig in "$GITHUB_WORKSPACE/dist/wallos/SHA256SUMS.sig" "$GITHUB_WORKSPACE/dist/wallos/wallos-manifest.txt.sig"; do
            [[ -f "$_sig" ]] || { echo "::error::$_sig missing; refusing to publish unsigned manifests"; exit 1; }
          done
          publish_release wallos-mirror "Wallos Recovery Mirror" "$notes" "$GITHUB_WORKSPACE/dist/wallos"

      - name: Publish test-tool stable recovery Release
        if: always() && github.event_name == 'workflow_dispatch' && inputs.refresh_test_tool_mirror && steps.test_tool_assets.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          tag='test-tools-mirror'
          title='A-Box Test Tools Mirror'
          notes="$RUNNER_TEMP/test-tools-notes.md"
          {
            printf 'Stable, fixed-name recovery copies of the benchmark, IP-quality and A-Check scripts used by A-Box.\n'
            printf 'Assets are downloaded from their upstream URLs, checked for shell syntax and non-HTML content, and accompanied by upstream license texts, a manifest, and SHA256SUMS.\n'
            printf 'The A-Box installer verifies the downloaded asset checksum and asks for explicit confirmation before executing third-party test scripts.\n'
          } > "$notes"

          asset_dir="$GITHUB_WORKSPACE/dist/test-tools"
          mapfile -t all_assets < <(find "$asset_dir" -maxdepth 1 -type f -print | sort)
          assets=()
          for asset in "${all_assets[@]}"; do
            [[ "$(basename "$asset")" == SHA256SUMS ]] || assets+=("$asset")
          done
          if (("${#assets[@]}" == 0)); then
            echo "::error::No test-tool assets found"
            exit 1
          fi

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "$title" --notes-file "$notes"
          fi
          gh release edit "$tag" --title "$title" --notes-file "$notes"
          # As above, publish payload first and checksum manifest last.
          gh release upload "$tag" "${assets[@]}" --clobber
          gh release upload "$tag" "$asset_dir/SHA256SUMS" --clobber
          [[ -f "$asset_dir/SHA256SUMS.sig" ]] && gh release upload "$tag" "$asset_dir/SHA256SUMS.sig" --clobber

          gh release edit "$tag" --draft=false --latest=false
          echo "Published ${title}: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"

  # P3-12 fix: give this workflow CI coverage on pull requests without
  # granting publish permissions or executing downloaded content.
  dry-run-validate:
    if: ${{ github.event_name == 'pull_request' }}
    name: Validate update-mirrors workflow (dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, pinned Node 24 runtime
        with:
          persist-credentials: false
      - name: Validate workflow YAML parses
        shell: bash
        run: python3 -c "import yaml; yaml.safe_load(open('.github/workflows/update-mirrors.yml'))"
      - name: Lint workflow with actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12, pinned to commit SHA
