name: Update stable recovery mirrors

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-mirrors.yml'

permissions:
  contents: write

concurrency:
  group: stable-recovery-mirrors
  cancel-in-progress: false

jobs:
  update-mirrors:
    name: Build, verify, and publish recovery assets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned to a resolved commit

      - name: Prepare Wallos source and multi-architecture Docker archives
        id: wallos_assets
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$GITHUB_WORKSPACE/dist/wallos"
          mkdir -p "$out"
          cd "$out"

          release_json="$(gh api repos/ellite/Wallos/releases/latest)"
          tag="$(jq -er '.tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' <<<"$release_json")"
          image_tag="${tag#v}"
          source_url="https://github.com/ellite/Wallos/archive/refs/tags/${tag}.tar.gz"

          echo "Wallos stable release: $tag"
          curl -fL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 300 \
            "$source_url" -o wallos-source.tar.gz
          gzip -t wallos-source.tar.gz
          tar -tzf wallos-source.tar.gz > "$RUNNER_TEMP/wallos-source-list.txt"
          grep -Fq '/LICENSE.md' "$RUNNER_TEMP/wallos-source-list.txt" || {
            echo "::error::Wallos source archive does not contain LICENSE.md"
            exit 1
          }

          pull_save_image() {
            local arch="$1" platform="$2" image="bellamy/wallos:${image_tag}"
            local asset="wallos-linux-${arch}.tar.gz" actual
            echo "Pulling ${image} for ${platform}"
            docker pull --platform "$platform" "$image"
            actual="$(docker image inspect --format '{{.Os}}/{{.Architecture}}{{if .Variant}}/{{.Variant}}{{end}}' "$image")"
            if [[ "$actual" != "$platform" ]]; then
              echo "::error::Expected ${platform}, but Docker inspected ${actual}"
              exit 1
            fi
            docker save "$image" | gzip -1 > "$asset"
            gzip -t "$asset"
            test -s "$asset"
          }

          pull_save_image amd64 linux/amd64
          pull_save_image arm64 linux/arm64
          pull_save_image armv7 linux/arm/v7

          retrieved_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > wallos-manifest.txt <<EOF
          tag=${tag}
          image=bellamy/wallos
          image_tag=${image_tag}
          source_url=${source_url}
          retrieved_at_utc=${retrieved_at}
          platform.amd64=linux/amd64
          platform.arm64=linux/arm64
          platform.armv7=linux/arm/v7
          EOF

          sha256sum wallos-source.tar.gz \
            wallos-linux-amd64.tar.gz \
            wallos-linux-arm64.tar.gz \
            wallos-linux-armv7.tar.gz > SHA256SUMS

          {
            echo "source_sha256=$(awk '$2=="wallos-source.tar.gz" {print $1}' SHA256SUMS)"
            echo "amd64_sha256=$(awk '$2=="wallos-linux-amd64.tar.gz" {print $1}' SHA256SUMS)"
            echo "arm64_sha256=$(awk '$2=="wallos-linux-arm64.tar.gz" {print $1}' SHA256SUMS)"
            echo "armv7_sha256=$(awk '$2=="wallos-linux-armv7.tar.gz" {print $1}' SHA256SUMS)"
          } >> wallos-manifest.txt

          test "$(grep -cE '^[A-Fa-f0-9]{64}  ' SHA256SUMS)" -eq 4
          sha256sum -c SHA256SUMS

      - name: Prepare benchmark and IP-quality tool mirror
        id: test_tool_assets
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$GITHUB_WORKSPACE/dist/test-tools"
          mkdir -p "$out"
          cd "$out"

          bench_url='https://bench.sh'
          ipquality_url='https://Check.Place'
          yabs_license_url='https://raw.githubusercontent.com/masonr/yet-another-bench-script/master/LICENSE'
          ipquality_license_url='https://raw.githubusercontent.com/xykt/ScriptMenu/main/LICENSE'

          curl -fL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 180 "$bench_url" -o bench.sh
          curl -fL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 180 "$ipquality_url" -o Check.Place.sh
          curl -fL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 60 "$yabs_license_url" -o YABS-LICENSE
          curl -fL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 60 "$ipquality_license_url" -o IPQuality-LICENSE

          validate_shell_script() {
            local file="$1" bytes first_line
            bytes="$(wc -c < "$file" | tr -d '[:space:]')"
            first_line="$(head -n 1 "$file")"
            if (( bytes < 1000 || bytes > 2000000 )); then
              echo "::error::Unexpected size for ${file}: ${bytes} bytes"
              return 1
            fi
            if [[ ! "$first_line" =~ ^#!.*(bash|sh) ]] || grep -Eiq '<!doctype[[:space:]]+html|<html([[:space:]>])' "$file"; then
              echo "::error::Refusing unexpected/non-shell content in ${file}"
              return 1
            fi
            bash -n "$file"
          }

          validate_shell_script bench.sh
          validate_shell_script Check.Place.sh
          test "$(wc -c < YABS-LICENSE)" -gt 100
          grep -Fq 'DO WHAT THE FUCK YOU WANT TO PUBLIC LICENSE' YABS-LICENSE
          test "$(wc -c < IPQuality-LICENSE)" -gt 1000

          retrieved_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > test-tools-manifest.txt <<EOF
          retrieved_at_utc=${retrieved_at}
          bench.sh.url=${bench_url}
          Check.Place.sh.url=${ipquality_url}
          YABS-LICENSE.url=${yabs_license_url}
          IPQuality-LICENSE.url=${ipquality_license_url}
          validation=non-empty;size-bounds;shebang;no-html-signature;bash-n
          EOF
          sha256sum bench.sh Check.Place.sh YABS-LICENSE IPQuality-LICENSE > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Publish Wallos stable recovery Release
        if: always() && steps.wallos_assets.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          publish_release() {
            local tag="$1" title="$2" notes_file="$3" asset_dir="$4"
            local release_id
            mapfile -t assets < <(find "$asset_dir" -maxdepth 1 -type f -print | sort)
            if (("${#assets[@]}" == 0)); then
              echo "::error::No assets found for ${tag}"
              return 1
            fi

            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --draft --target "$GITHUB_SHA" \
                --title "$title" --notes-file "$notes_file"
            fi

            gh release edit "$tag" --title "$title" --notes-file "$notes_file"
            gh release upload "$tag" "${assets[@]}" --clobber

            release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.id')"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -F draft=false -f make_latest=false >/dev/null
            echo "Published ${title}: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
          }

          notes="$RUNNER_TEMP/wallos-notes.md"
          cat > "$notes" <<'EOF'
          Stable, fixed-name recovery assets for the Wallos installer.
          The installer uses this Release only when upstream stable-release metadata or Docker Hub retrieval fails.
          Assets include Docker image archives for amd64, arm64, and armv7, the upstream source archive, a manifest, and SHA256SUMS.
          The publishing workflow verifies archive integrity, platform identity, and SHA-256 before upload.
          EOF
          publish_release wallos-mirror "Wallos Recovery Mirror" "$notes" "$GITHUB_WORKSPACE/dist/wallos"

      - name: Publish test-tool stable recovery Release
        if: always() && steps.test_tool_assets.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          tag='test-tools-mirror'
          title='A-Box Test Tools Mirror'
          notes="$RUNNER_TEMP/test-tools-notes.md"
          cat > "$notes" <<'EOF'
          Stable, fixed-name recovery copies of the benchmark and IP-quality scripts used by A-Box.
          Assets are downloaded from their upstream URLs, checked for shell syntax and non-HTML content, and accompanied by upstream license texts, a manifest, and SHA256SUMS.
          The A-Box installer verifies the downloaded asset checksum and asks for explicit confirmation before executing third-party test scripts.
          EOF

          asset_dir="$GITHUB_WORKSPACE/dist/test-tools"
          mapfile -t assets < <(find "$asset_dir" -maxdepth 1 -type f -print | sort)
          if (("${#assets[@]}" == 0)); then
            echo "::error::No test-tool assets found"
            exit 1
          fi

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "$title" --notes-file "$notes"
          fi
          gh release edit "$tag" --title "$title" --notes-file "$notes"
          gh release upload "$tag" "${assets[@]}" --clobber

          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.id')"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false -f make_latest=false >/dev/null
          echo "Published ${title}: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
