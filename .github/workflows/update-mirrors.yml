name: Update stable recovery mirrors

on:
  workflow_dispatch:
    inputs:
      refresh_test_tool_mirror:
        description: "Refresh mutable third-party shell tools after reviewing upstream changes"
        type: boolean
        required: false
        default: false
      known_good_sha256:
        description: "Space-separated 'bench.sh=<sha256> Check.Place.sh=<sha256>' after manual review"
        type: string
        required: false
        default: ""
  schedule:
    - cron: '17 5 * * 1'
  pull_request:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-mirrors.yml'

permissions:
  contents: read

concurrency:
  group: stable-recovery-mirrors
  cancel-in-progress: false

jobs:
  update-mirrors:
    name: Build, verify, and publish recovery assets
    # P3-12 fix: never run the publishing job on pull requests; only the
    # read-only dry-run-validate job runs on PRs.
    if: ${{ github.event_name != 'pull_request' }}
    # N-13 fix: write permission scoped to this job only, not the whole workflow.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # F-05: Ed25519 signing key for mirror metadata (base64 raw 32-byte seed).
      # Absent in forks: signing steps skip gracefully.
      ABOX_SIGNING_PRIVKEY_B64: ${{ secrets.ABOX_SIGNING_PRIVKEY_B64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, pinned Node 24 runtime
        with:
          persist-credentials: false

      - name: Prepare Wallos source and multi-architecture Docker archives
        id: wallos_assets
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$GITHUB_WORKSPACE/dist/wallos"
          mkdir -p "$out"
          cd "$out"

          release_json="$(gh api repos/ellite/Wallos/releases/latest)"
          tag="$(jq -er '.tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' <<<"$release_json")"
          image_tag="${tag#v}"

          echo "Wallos stable release: $tag"
          # P3-10 fix: verify provenance of the source tarball. Resolve the
          # tag to its commit SHA via the GitHub API, then download from the
          # SHA-based archive URL (not the tag-based URL). GitHub redirects
          # tag URLs to codeload .../tar.gz/refs/tags/<tag> (tag, never SHA),
          # so a redirect check against the SHA always fails on tag URLs.
          # The SHA URL redirects to .../tar.gz/<sha>, and the check below
          # confirms the redirect target contains the expected SHA. This
          # proves the tarball came from the tagged commit; it is NOT a
          # content-hash check against an expected value.
          tag_commit_sha="$(gh api "repos/ellite/Wallos/commits/${tag}" --jq '.sha')"
          [[ "$tag_commit_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not resolve Wallos tag $tag to a commit SHA"
            exit 1
          }
          source_url="https://github.com/ellite/Wallos/archive/${tag_commit_sha}.tar.gz"
          effective_url="$(curl -fsSL -o /dev/null -w '%{url_effective}' "$source_url")"
          [[ "$effective_url" == *"$tag_commit_sha"* ]] || {
            echo "::error::Wallos source URL does not resolve to commit $tag_commit_sha (got $effective_url)"
            exit 1
          }
          curl -fL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 300 \
            "$source_url" -o wallos-source.tar.gz
          gzip -t wallos-source.tar.gz
          tar -tzf wallos-source.tar.gz > "$RUNNER_TEMP/wallos-source-list.txt"
          grep -Eq '(^|/)LICENSE\.md$' "$RUNNER_TEMP/wallos-source-list.txt" || {
            echo "::error::Wallos source archive does not contain LICENSE.md"
            exit 1
          }

          pull_save_image() {
            local arch="$1" platform="$2" image="bellamy/wallos:${image_tag}"
            local asset="wallos-linux-${arch}.tar.gz" actual
            echo "Pulling ${image} for ${platform}"
            docker pull --platform "$platform" "$image"
            actual="$(docker image inspect --format '{{.Os}}/{{.Architecture}}{{if .Variant}}/{{.Variant}}{{end}}' "$image")"
            if [[ "$actual" != "$platform" ]]; then
              echo "::error::Expected ${platform}, but Docker inspected ${actual}"
              exit 1
            fi
            # P2-1 fix: record the image digest for consumer-side verification.
            # Tags are mutable; the digest pins the exact image pulled here.
            local digest
            digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image" 2>/dev/null || true)"
            [[ -n "$digest" && "$digest" != '<no value>' ]] || {
              echo "::error::Could not determine RepoDigest for $image"
              exit 1
            }
            printf -v "digest_${arch}" '%s' "$digest"
            docker save "$image" | gzip -1 > "$asset"
            gzip -t "$asset"
            test -s "$asset"
          }

          pull_save_image amd64 linux/amd64
          pull_save_image arm64 linux/arm64
          pull_save_image armv7 linux/arm/v7

          retrieved_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          {
            printf 'tag=%s\n' "${tag}"
            printf 'image=bellamy/wallos\n'
            printf 'image_tag=%s\n' "${image_tag}"
            printf 'image_digest.amd64=%s\n' "${digest_amd64}"
            printf 'image_digest.arm64=%s\n' "${digest_arm64}"
            printf 'image_digest.armv7=%s\n' "${digest_armv7}"
            printf 'source_url=%s\n' "${source_url}"
            printf 'retrieved_at_utc=%s\n' "${retrieved_at}"
            printf 'platform.amd64=linux/amd64\n'
            printf 'platform.arm64=linux/arm64\n'
            printf 'platform.armv7=linux/arm/v7\n'
          } > wallos-manifest.txt

          # D-2: Include wallos-manifest.txt in SHA256SUMS so consumers can
          # verify the manifest itself (previously only 4 tar.gz files were listed).
          # FIX: Hash ONLY the 4 tarballs first (NOT the manifest), because the
          # manifest is mutated below (SHA lines appended). Hashing the manifest
          # before mutation would record a stale hash and break the line count.
          sha256sum wallos-source.tar.gz \
            wallos-linux-amd64.tar.gz \
            wallos-linux-arm64.tar.gz \
            wallos-linux-armv7.tar.gz > SHA256SUMS

          {
            echo "source_sha256=$(awk '$2=="wallos-source.tar.gz" {print $1}' SHA256SUMS)"
            echo "amd64_sha256=$(awk '$2=="wallos-linux-amd64.tar.gz" {print $1}' SHA256SUMS)"
            echo "arm64_sha256=$(awk '$2=="wallos-linux-arm64.tar.gz" {print $1}' SHA256SUMS)"
            echo "armv7_sha256=$(awk '$2=="wallos-linux-armv7.tar.gz" {print $1}' SHA256SUMS)"
          } >> wallos-manifest.txt


          # Boundary 2: Add final manifest (after SHA appends) to SHA256SUMS.
          # Client verifies manifest hash against SHA256SUMS (D-2 fail-closed).
          # The manifest hash recorded here is the FINAL content (post-append).
          # Total: 4 tarballs + final manifest = 5 lines.
          sha256sum wallos-manifest.txt >> SHA256SUMS
          test "$(grep -cE '^[A-Fa-f0-9]{64}  ' SHA256SUMS)" -eq 5
          sha256sum -c SHA256SUMS

          # F-05: Detached Ed25519 signature for wallos-manifest.txt.
          # Uses ABOX_SIGNING_PRIVKEY_B64 secret; skips if absent.
          # See docs/SIGNING.md.
          if [[ -n "${ABOX_SIGNING_PRIVKEY_B64:-}" ]]; then
            umask 077
            python3 -c 'import base64,sys;raw=base64.b64decode(sys.argv[1],validate=True);assert len(raw)==32;der=bytes.fromhex("302e020100300506032b657004220402")+raw;sys.stdout.write("-----BEGIN PRIVATE KEY-----\n"+base64.encodebytes(der).decode().strip()+"\n-----END PRIVATE KEY-----\n")' "$ABOX_SIGNING_PRIVKEY_B64" > /tmp/abox-sign-priv.pem
            openssl pkeyutl -sign -inkey /tmp/abox-sign-priv.pem -rawin \
              -in wallos-manifest.txt | base64 > wallos-manifest.txt.sig
            openssl pkeyutl -verify -pubin \
              -inkey <(openssl pkey -in /tmp/abox-sign-priv.pem -pubout) \
              -rawin -in wallos-manifest.txt \
              -sigfile <(base64 -d wallos-manifest.txt.sig) \
              || { echo "ERROR: F-05 self-check failed for wallos-manifest.txt"; exit 1; }
            echo "Signed: wallos-manifest.txt.sig"
            shred -u /tmp/abox-sign-priv.pem 2>/dev/null || rm -f /tmp/abox-sign-priv.pem
          else
            echo "::notice::ABOX_SIGNING_PRIVKEY_B64 not set; skipping Wallos F-05 signing."
          fi

      - name: Prepare benchmark and IP-quality tool mirror
        id: test_tool_assets
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_test_tool_mirror
        shell: bash
        # FINAL-AUDIT fix: pass the workflow_dispatch input via env: so the
        # value is never interpolated into the run: script text. Direct
        # ${{ inputs... }} interpolation inside double quotes lets a malicious
        # input's $(...) / backticks execute before format validation runs.
        env:
          KNOWN_GOOD_SHA256_INPUT: ${{ inputs.known_good_sha256 }}
        run: |
          set -Eeuo pipefail
          # SECURITY: These scripts are downloaded from mutable upstream URLs.
          # The SHA256SUMS generated below is self-attestation, NOT independent
          # verification. Before first use of a new upstream version, a human
          # MUST manually review the diff. Do not auto-approve.
          # Test-tools FIX: KNOWN_GOOD_SHA256 is now REQUIRED (was optional).
          # Mutable upstream scripts must be pinned to human-reviewed hashes
          # before publishing. Empty value aborts the build.
          KNOWN_GOOD_SHA256="${KNOWN_GOOD_SHA256:-${KNOWN_GOOD_SHA256_INPUT:-}}"
          [[ -n "$KNOWN_GOOD_SHA256" ]] || {
            echo "::error::KNOWN_GOOD_SHA256 is required (bench.sh=<sha256> Check.Place.sh=<sha256>)"
            exit 1
          }
          # Argon: Validate each pin format (allowed file + 64-hex SHA) and
          # compare case-insensitively. Require both bench.sh and Check.Place.sh.
          declare -A seen_pins=()
          read -ra pinned_entries <<< "$KNOWN_GOOD_SHA256"
          for entry in "${pinned_entries[@]}"; do
            pinned_file="${entry%%=*}"
            pinned_sha="${entry#*=}"
            case "$pinned_file" in bench.sh|Check.Place.sh|YABS-LICENSE|IPQuality-LICENSE) ;; *)
              echo "::error::Unexpected file in KNOWN_GOOD_SHA256: $pinned_file"; exit 1 ;;
            esac
            [[ "$pinned_sha" =~ ^[A-Fa-f0-9]{64}$ ]] || {
              echo "::error::Invalid SHA-256 format for $pinned_file: $pinned_sha"; exit 1
            }
            seen_pins["$pinned_file"]=1
          done
          [[ -n "${seen_pins[bench.sh]:-}" && -n "${seen_pins[Check.Place.sh]:-}" ]] || {
            echo "::error::KNOWN_GOOD_SHA256 must pin both bench.sh and Check.Place.sh"
            exit 1
          }
          out="$GITHUB_WORKSPACE/dist/test-tools"
          mkdir -p "$out"
          cd "$out"

          bench_url='https://bench.sh'
          ipquality_url='https://Check.Place'
          yabs_license_url='https://raw.githubusercontent.com/masonr/yet-another-bench-script/master/LICENSE'
          ipquality_license_url='https://raw.githubusercontent.com/xykt/ScriptMenu/main/LICENSE'

          curl -fL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 180 "$bench_url" -o bench.sh
          curl -fL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 180 "$ipquality_url" -o Check.Place.sh
          curl -fL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 60 "$yabs_license_url" -o YABS-LICENSE
          curl -fL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 60 "$ipquality_license_url" -o IPQuality-LICENSE

          validate_shell_script() {
            local file="$1" bytes first_line
            bytes="$(wc -c < "$file" | tr -d '[:space:]')"
            first_line="$(head -n 1 "$file")"
            if (( bytes < 1000 || bytes > 2000000 )); then
              echo "::error::Unexpected size for ${file}: ${bytes} bytes"
              return 1
            fi
            if [[ ! "$first_line" =~ ^#!.*bash([[:space:]]|$) ]] || grep -Eiq '<!doctype[[:space:]]+html|<html([[:space:]>])' "$file"; then
              echo "::error::Refusing unexpected/non-shell content in ${file}"
              return 1
            fi
            bash -n "$file"
          }

          validate_shell_script bench.sh
          validate_shell_script Check.Place.sh
          test "$(wc -c < YABS-LICENSE)" -gt 100
          grep -Fq 'DO WHAT THE FUCK YOU WANT TO PUBLIC LICENSE' YABS-LICENSE
          test "$(wc -c < IPQuality-LICENSE)" -gt 1000

          # P2-2 fix: REQUIRED pin check (KNOWN_GOOD_SHA256 validated above).
          # Verify each downloaded file against the pinned hashes.
          if [[ -n "${KNOWN_GOOD_SHA256:-}" ]]; then
            read -ra pinned_entries <<< "$KNOWN_GOOD_SHA256"
            for entry in "${pinned_entries[@]}"; do
              pinned_file="${entry%%=*}"
              pinned_sha="${entry#*=}"
              actual_sha="$(sha256sum "$pinned_file" | awk '{print $1}')"
              [[ "${actual_sha,,}" == "${pinned_sha,,}" ]] || {
                echo "::error::KNOWN_GOOD_SHA256 mismatch for $pinned_file"
                exit 1
              }
            done
            echo "KNOWN_GOOD_SHA256 pin check passed."
          fi

          retrieved_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          {
            printf 'retrieved_at_utc=%s\n' "${retrieved_at}"
            printf 'bench.sh.url=%s\n' "${bench_url}"
            printf 'Check.Place.sh.url=%s\n' "${ipquality_url}"
            printf 'YABS-LICENSE.url=%s\n' "${yabs_license_url}"
            printf 'IPQuality-LICENSE.url=%s\n' "${ipquality_license_url}"
            printf 'validation=non-empty;size-bounds;shebang;no-html-signature;bash-n\n'
          } > test-tools-manifest.txt
          sha256sum bench.sh Check.Place.sh YABS-LICENSE IPQuality-LICENSE > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Publish Wallos stable recovery Release
        if: always() && steps.wallos_assets.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          publish_release() {
            local tag="$1" title="$2" notes_file="$3" asset_dir="$4"
            mapfile -t all_assets < <(find "$asset_dir" -maxdepth 1 -type f -print | sort)
            assets=()
            for asset in "${all_assets[@]}"; do
              [[ "$(basename "$asset")" == SHA256SUMS ]] || assets+=("$asset")
            done
            if (("${#assets[@]}" == 0)); then
              echo "::error::No assets found for ${tag}"
              return 1
            fi

            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --draft --target "$GITHUB_SHA" \
                --title "$title" --notes-file "$notes_file"
            fi

            gh release edit "$tag" --title "$title" --notes-file "$notes_file"
            # Upload payload first and SHA256SUMS last. A partial update then fails closed
            # against the previous manifest instead of publishing a new manifest early.
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release upload "$tag" "$asset_dir/SHA256SUMS" --clobber

            gh release edit "$tag" --draft=false --latest=false
            echo "Published ${title}: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
          }

          notes="$RUNNER_TEMP/wallos-notes.md"
          {
            printf 'Stable, fixed-name recovery assets for the Wallos installer.\n'
            printf 'The installer uses this Release only when upstream stable-release metadata or Docker Hub retrieval fails.\n'
            printf 'Assets include Docker image archives for amd64, arm64, and armv7, the upstream source archive, a manifest, and SHA256SUMS.\n'
            printf 'The publishing workflow verifies archive integrity, platform identity, and SHA-256 before upload.\n'
          } > "$notes"
          publish_release wallos-mirror "Wallos Recovery Mirror" "$notes" "$GITHUB_WORKSPACE/dist/wallos"

      - name: Publish test-tool stable recovery Release
        if: always() && github.event_name == 'workflow_dispatch' && inputs.refresh_test_tool_mirror && steps.test_tool_assets.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          tag='test-tools-mirror'
          title='A-Box Test Tools Mirror'
          notes="$RUNNER_TEMP/test-tools-notes.md"
          {
            printf 'Stable, fixed-name recovery copies of the benchmark and IP-quality scripts used by A-Box.\n'
            printf 'Assets are downloaded from their upstream URLs, checked for shell syntax and non-HTML content, and accompanied by upstream license texts, a manifest, and SHA256SUMS.\n'
            printf 'The A-Box installer verifies the downloaded asset checksum and asks for explicit confirmation before executing third-party test scripts.\n'
          } > "$notes"

          asset_dir="$GITHUB_WORKSPACE/dist/test-tools"
          mapfile -t all_assets < <(find "$asset_dir" -maxdepth 1 -type f -print | sort)
          assets=()
          for asset in "${all_assets[@]}"; do
            [[ "$(basename "$asset")" == SHA256SUMS ]] || assets+=("$asset")
          done
          if (("${#assets[@]}" == 0)); then
            echo "::error::No test-tool assets found"
            exit 1
          fi

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "$title" --notes-file "$notes"
          fi
          gh release edit "$tag" --title "$title" --notes-file "$notes"
          # As above, publish payload first and checksum manifest last.
          gh release upload "$tag" "${assets[@]}" --clobber
          gh release upload "$tag" "$asset_dir/SHA256SUMS" --clobber

          gh release edit "$tag" --draft=false --latest=false
          echo "Published ${title}: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"

  # P3-12 fix: give this workflow CI coverage on pull requests without
  # granting publish permissions or executing downloaded content.
  dry-run-validate:
    if: ${{ github.event_name == 'pull_request' }}
    name: Validate update-mirrors workflow (dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, pinned Node 24 runtime
        with:
          persist-credentials: false
      - name: Validate workflow YAML parses
        shell: bash
        run: python3 -c "import yaml; yaml.safe_load(open('.github/workflows/update-mirrors.yml'))"
      - name: Lint workflow with actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12, pinned to commit SHA
